name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orbita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: '3000'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: orbita_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-value-longer-than-32-characters
      ALLOWED_ORIGINS: http://localhost:3000

    defaults:
      run:
        working-directory: messanger_backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: messanger_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d orbita_test -f db/schema.sql

      - name: Apply migrations
        run: npm run migrate

      - name: Check migrations are idempotent
        run: npm run migrate

      - name: Run tests
        run: npm test

  flutter:
    name: Flutter (analyze + tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: messanger_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env лежит в .gitignore, но перечислен в assets — без него сборка падает.
      - name: Create placeholder .env
        run: |
          printf '%s\n' \
            'BASE_URL=http://127.0.0.1:3000' \
            'SOCKET_URL=http://127.0.0.1:3000' \
            'BASE_URL_API=${BASE_URL}/api' \
            > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
