# Бюджет памяти рассчитан на машину с 8 ГБ ОЗУ: JVM Gradle + Kotlin-демон +
# dex/R8 не должны суммарно выходить за физическую память, иначе демон падает
# с "insufficient memory for the Java Runtime Environment" (см. hs_err_pid*.log).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
# Ограничиваем параллелизм: каждый воркер R8/dex — это отдельный буфер памяти.
org.gradle.workers.max=2
# Инкрементальный кэш Kotlin падает на Windows, когда pub-кэш лежит на C:,
# а проект на D: ("this and base files have different roots"). Отключаем.
kotlin.incremental=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
